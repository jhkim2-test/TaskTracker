<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="stylesheet" href="file:///C:/Users/JHKIM2/Downloads/index_files/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f4;
      --bg-tertiary: #f0efea;
      --text-primary: #1a1a19;
      --text-secondary: #6b6b68;
      --text-tertiary: #9b9b97;
      --border-light: rgba(0,0,0,0.10);
      --border-mid: rgba(0,0,0,0.18);
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1a;
        --bg-secondary: #252523;
        --bg-tertiary: #2e2e2b;
        --text-primary: #f0efea;
        --text-secondary: #a8a8a4;
        --text-tertiary: #6b6b68;
        --border-light: rgba(255,255,255,0.10);
        --border-mid: rgba(255,255,255,0.18);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── Lock ── */
    .lock-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg-tertiary); }
    .lock-card { background:var(--bg-primary); border:0.5px solid var(--border-light); border-radius:var(--radius-lg); padding:2rem 2rem 1.75rem; width:100%; max-width:360px; }
    .lock-icon { width:44px; height:44px; border-radius:50%; background:var(--bg-secondary); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--text-secondary); margin-bottom:1.25rem; }
    .lock-title { font-size:17px; font-weight:500; color:var(--text-primary); margin-bottom:4px; }
    .lock-sub { font-size:13px; color:var(--text-secondary); margin-bottom:1.5rem; }
    .lock-input { width:100%; font-family:inherit; font-size:14px; padding:9px 12px; border-radius:var(--radius-md); border:0.5px solid var(--border-mid); background:var(--bg-primary); color:var(--text-primary); margin-bottom:10px; }
    .lock-input:focus { outline:none; border-color:#378ADD; }
    .lock-btn { width:100%; padding:9px; border-radius:var(--radius-md); border:none; background:var(--text-primary); color:var(--bg-primary); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; margin-bottom:10px; }
    .lock-btn:hover { opacity:0.85; }
    .lock-error { font-size:12px; color:#A32D2D; display:none; margin-bottom:8px; }
    .lock-hint { font-size:11px; color:var(--text-tertiary); text-align:center; margin-top:4px; }

    /* ── Topbar ── */
    .topbar { background:var(--bg-primary); border-bottom:0.5px solid var(--border-light); padding:0 1.5rem; height:52px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; }
    .topbar-logo { font-size:15px; font-weight:500; color:var(--text-primary); display:flex; align-items:center; gap:8px; }
    .topbar-logo i { font-size:18px; }

    .container { max-width:1440px; margin:0 auto; padding:1.2rem 1.2rem; }

    /* ── Tabs / Buttons ── */
    .tabs { display:flex; gap:3px; background:var(--bg-secondary); border-radius:var(--radius-md); padding:3px; }
    .tab { padding:5px 14px; border-radius:6px; font-size:13px; cursor:pointer; border:none; background:transparent; color:var(--text-secondary); font-family:inherit; transition:all 0.15s; display:flex; align-items:center; gap:5px; }
    .tab.active { background:var(--bg-primary); color:var(--text-primary); font-weight:500; border:0.5px solid var(--border-light); }

    .btn { padding:6px 14px; border-radius:var(--radius-md); border:0.5px solid var(--border-mid); background:var(--bg-primary); color:var(--text-primary); font-size:13px; cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:6px; transition:background 0.1s; }
    .btn:hover { background:var(--bg-secondary); }
    .btn-primary { background:var(--text-primary); color:var(--bg-primary); border-color:transparent; }
    .btn-primary:hover { opacity:0.85; background:var(--text-primary); }
    .btn-sm { padding:3px 9px; font-size:12px; }

    /* ── Stats ── */
    .summary-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:1.25rem; }
    @media (max-width:640px) { .summary-row { grid-template-columns:repeat(2,1fr); } }
    .stat-card { background:var(--bg-primary); border:0.5px solid var(--border-light); border-radius:var(--radius-md); padding:12px 14px; }
    .stat-label { font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
    .stat-val { font-size:22px; font-weight:500; color:var(--text-primary); }

    /* ── Filter bar ── */
    .filter-bar { display:flex; gap:8px; margin-bottom:1rem; flex-wrap:wrap; align-items:center; }
    .filter-bar input, .filter-bar select { font-family:inherit; font-size:13px; padding:6px 10px; border-radius:var(--radius-md); border:0.5px solid var(--border-mid); background:var(--bg-primary); color:var(--text-primary); }
    .filter-bar input { flex:1; min-width:160px; }
    #filter-goal { max-width:200px; }

    /* ── View toggle ── */
    .view { display:none; }
    .view.active { display:block; }

    /* ── Board (프로젝트 → 과업 → 세부업무) ── */
    .board-crumbs { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:10px; font-size:13px; color:var(--text-tertiary); }
    .board-crumbs:empty { display:none; }
    .crumb { font-family:inherit; font-size:13px; padding:2px 4px; border:none; background:none; color:var(--text-secondary); cursor:pointer; border-radius:4px; }
    .crumb:hover { background:var(--bg-secondary); color:var(--text-primary); }
    .crumb-current { padding:2px 4px; font-weight:500; color:var(--text-primary); }
    .board-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr)); gap:10px; }
    .board-grid > .empty-col { grid-column:1 / -1; }
    .board-columns { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.4fr); gap:10px; height:calc(100vh - 240px); min-height:380px; }
    .board-col { display:flex; flex-direction:column; min-height:0; background:var(--bg-secondary); border:0.5px solid var(--border-light); border-radius:var(--radius-md); overflow:hidden; }
    .board-col-head { display:flex; align-items:center; gap:6px; padding:9px 12px; font-size:13px; font-weight:500; color:var(--text-secondary); }
    .board-col-count { font-size:12px; font-weight:400; color:var(--text-tertiary); }
    .board-col-body { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:2px 8px 8px; }
    @media (max-width:900px) {
      .board-columns { grid-template-columns:minmax(0,1fr); height:auto; }
      .board-col-body { overflow-y:visible; }
    }
    .board-card { position:relative; display:flex; flex-direction:column; gap:6px; padding:12px 12px 10px; flex-shrink:0; background:var(--bg-primary); border:0.5px solid var(--border-light); border-radius:var(--radius-md); cursor:pointer; transition:border-color 0.15s; }
    .board-card:hover { border-color:var(--border-mid); }
    .board-card.selected { border-color:#185FA5; box-shadow:inset 0 0 0 1px #185FA5; }
    .dragging { opacity:0.4; }
    .board-card.drop-target { border-color:#2E7CD6; background:#EAF2FC; box-shadow:inset 0 0 0 1px #2E7CD6; }
    .board-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding-right:32px; }
    .board-card-title { flex:1; min-width:0; font-size:15.5px; font-weight:500; line-height:1.4; color:var(--text-primary); overflow-wrap:anywhere; }
    .board-card-sub { font-size:12px; color:var(--text-tertiary); }
    /* 평소에는 숨겨 두고 카드 오른쪽 위 모서리에 커서를 올릴 때만 보인다 */
    .card-tools { position:absolute; top:3px; right:3px; display:flex; gap:2px; opacity:0; transition:opacity 0.1s; }
    .card-tools:hover, .card-tools:has(:focus-visible) { opacity:1; }
    @media (hover:none) { .card-tools { opacity:0.7; } }
    .card-tool { width:20px; height:20px; padding:0; display:flex; align-items:center; justify-content:center; font-family:inherit; font-size:13px; line-height:1; color:var(--text-tertiary); background:none; border:none; cursor:pointer; }
    .card-tool:hover { color:var(--text-primary); }
    .card-tool-x:hover { color:#A32D2D; }
    .board-progress { height:7px; margin:2px 32px 2px 0; border-radius:4px; overflow:hidden; background:var(--bg-tertiary); }
    .board-progress span { display:block; height:100%; border-radius:4px; background:#2E7CD6; }
    .board-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:20px; font-size:12px; color:var(--text-secondary); }
    .board-card.is-done .board-card-title { text-decoration:line-through; color:var(--text-tertiary); }
    .board-add-card { flex-shrink:0; margin-top:6px; min-height:64px; display:flex; align-items:center; justify-content:center; font-family:inherit; font-size:24px; font-weight:300; color:var(--text-tertiary); background:transparent; border:1px dashed var(--border-mid); border-radius:var(--radius-md); cursor:pointer; transition:background 0.1s, color 0.1s; }
    .board-add-card:hover { color:var(--text-primary); background:var(--bg-primary); }
    .board-card.board-form { flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 12px; cursor:default; }
    .board-col-body > .board-form:last-child { margin-top:6px; }
    .board-form input { flex:1; min-width:0; font-family:inherit; font-size:13px; padding:5px 8px; border-radius:var(--radius-md); border:0.5px solid var(--border-mid); background:var(--bg-primary); color:var(--text-primary); }
    .board-form .btn { flex-shrink:0; white-space:nowrap; }
    .board-form-error { flex-basis:100%; font-size:12px; color:#A32D2D; }

    /* ── Task card ── */
    .task-card {
      position: relative;
      background: var(--bg-primary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .task-card:hover { border-color: var(--border-mid); }

    /* D-day urgency colours — 더 진한 빨간색 */
    .task-card.urgent-d7  { background:#FFF5DC; border-color:#E8A020; border-width:1px; }
    .task-card.urgent-d3  { background:#FFE4E4; border-color:#D94040; border-width:1.5px; }
    .task-card.urgent-day { background:#FFD0D0; border-color:#B81C1C; border-width:2px; }

    /* Card inner layout */
    .task-card-top { display:flex; align-items:center; gap:8px; padding-right:14px; }
    .check-btn { width:20px; height:20px; flex-shrink:0; padding:0; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--border-mid); border-radius:50%; background:var(--bg-primary); color:#fff; font-size:12px; line-height:1; cursor:pointer; }
    .check-btn:hover { border-color:#639922; }
    .task-card.is-done { background:var(--bg-primary); }
    .task-card.is-done .check-btn { background:#639922; border-color:#639922; }
    .task-card.is-done .task-title { text-decoration:line-through; color:var(--text-tertiary); }
    .status-select { font-family:inherit; font-size:11px; font-weight:500; padding:2px 4px; border-radius:10px; border:0.5px solid var(--border-mid); cursor:pointer; }
    /* 칸 너비를 고정해 카드끼리 마감·우선순위·상태가 세로로 맞는다 */
    .task-card-meta { display:grid; grid-template-columns:48px 42px 74px; align-items:center; justify-items:center; gap:6px; flex-shrink:0; }
    .task-card-meta .status-select { width:100%; }
    .task-title { flex:1; min-width:0; font-size:15px; font-weight:500; color:var(--text-primary); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    @media (max-width:500px) {
      .task-card-top { flex-wrap:wrap; }
      .task-title { flex-basis:calc(100% - 28px); }
      .task-card-meta { margin-left:auto; }
    }

    /* ── Priority badges ── */
    .priority { font-size:11.9px; padding:2px 7px; border-radius:10px; font-weight:500; white-space:nowrap; }
    .p-high { background:#FCEBEB; color:#A32D2D; }
    .p-mid  { background:#FAEEDA; color:#854F0B; }
    .p-low  { background:#EAF3DE; color:#3B6D11; }

    /* ── Due label ── */
    .due-label { font-size:11px; color:var(--text-tertiary); }
    .due-label.overdue { display:inline-block; background:#C0392B; color:#fff; font-weight:700; padding:2px 7px; border-radius:10px; }
    .due-label.d-day   { display:inline-block; background:#C0392B; color:#fff; font-weight:700; padding:2px 7px; border-radius:10px; }
    .due-label.d3      { display:inline-block; background:#E74C3C; color:#fff; font-weight:600; padding:2px 7px; border-radius:10px; }
    .due-label.d7      { display:inline-block; background:#E67E22; color:#fff; font-weight:500; padding:2px 7px; border-radius:10px; }

    /* ── List table ── */
    .list-table { width:100%; border-collapse:collapse; background:var(--bg-primary); border-radius:var(--radius-lg); overflow:hidden; border:0.5px solid var(--border-light); }
    .list-table th { font-size:12px; font-weight:500; color:var(--text-secondary); text-align:left; padding:10px 12px; border-bottom:0.5px solid var(--border-light); white-space:nowrap; }
    .list-table td { font-size:13px; padding:10px 12px; border-bottom:0.5px solid var(--border-light); color:var(--text-primary); vertical-align:middle; }
    .list-table tr:last-child td { border-bottom:none; }
    .list-table tbody tr:hover td { background:var(--bg-secondary); }

    /* ── Status badge ── */
    .s-todo       { background:var(--bg-secondary); color:var(--text-secondary); }
    .s-inprogress { background:#E6F1FB; color:#185FA5; }
    .s-wait       { background:#FAEEDA; color:#854F0B; }
    .s-done       { background:#EAF3DE; color:#3B6D11; }

    .empty-col { font-size:12px; color:var(--text-tertiary); text-align:center; padding:1.5rem 0; }

    /* ── List view Excel download btn ── */
    .list-header { display:flex; align-items:center; justify-content:flex-end; margin-bottom:8px; }

    /* ══════════════════════════════════════
       MODALS
    ══════════════════════════════════════ */
    .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; align-items:center; justify-content:center; padding:1rem; }
    .modal-bg.open { display:flex; }

    /* ── Create modal (standard width) ── */
    .modal {
      background:var(--bg-primary);
      border-radius:var(--radius-lg);
      border:0.5px solid var(--border-light);
      padding:1.25rem 1.5rem 1.5rem;
      width:100%;
      max-width:460px;
      max-height:90vh;
      overflow-y:auto;
    }

    /* ── Edit modal (wider, 2-panel) ── */
    .modal-edit {
      background:var(--bg-primary);
      border-radius:var(--radius-lg);
      border:0.5px solid var(--border-light);
      width:90vw;
      max-width:700px;
      height:78vh;
      max-height:700px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }

    .modal-edit-body {
      display:flex;
      flex:1;
      overflow:hidden;
    }

    /* Main pane */
    .modal-edit-main {
      flex:1;
      padding:1.25rem 1.5rem 1.5rem;
      display:flex;
      flex-direction:column;
      overflow-y:auto;
    }

    /* Settings slide panel */
    .modal-edit-panel {
      width:0;
      overflow:hidden;
      border-left:0.5px solid var(--border-light);
      transition:width 0.22s ease;
      flex-shrink:0;
      background:var(--bg-secondary);
    }
    .modal-edit-panel.open {
      width:280px;
    }
    .modal-edit-panel-inner {
      width:280px;
      padding:1.25rem 1rem 1rem;
    }

    /* Modal header row */
    .modal-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:1rem;
    }
    .modal-header h2 { font-size:16px; font-weight:500; color:var(--text-primary); }
    .modal-header-actions { display:flex; align-items:center; gap:6px; }

    /* Status button (pill, click to cycle) */
    .status-pill {
      font-size:12px;
      padding:3px 12px;
      border-radius:20px;
      border:0.5px solid transparent;
      cursor:pointer;
      font-family:inherit;
      font-weight:500;
      white-space:nowrap;
      transition:all 0.1s;
    }
    .status-pill.s-todo       { background:var(--bg-secondary); color:var(--text-secondary); border-color:var(--border-mid); }
    .status-pill.s-inprogress { background:#E6F1FB; color:#185FA5; border-color:#B5D4F4; }
    .status-pill.s-wait       { background:#FAEEDA; color:#854F0B; border-color:#FAC775; }
    .status-pill.s-done       { background:#EAF3DE; color:#3B6D11; border-color:#C0DD97; }

    .gear-btn {
      width:30px; height:30px;
      border-radius:var(--radius-md);
      border:0.5px solid var(--border-mid);
      background:var(--bg-primary);
      color:var(--text-secondary);
      display:flex; align-items:center; justify-content:center;
      font-size:15px;
      cursor:pointer;
      transition:background 0.1s;
      flex-shrink:0;
    }
    .gear-btn:hover { background:var(--bg-secondary); }
    .gear-btn.active { background:var(--bg-tertiary); color:var(--text-primary); }

    /* Fields */
    .field { margin-bottom:12px; }
    .field label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
    .field input, .field select, .field textarea {
      width:100%; font-family:inherit; font-size:13px; padding:7px 10px;
      border-radius:var(--radius-md); border:0.5px solid var(--border-mid);
      background:var(--bg-primary); color:var(--text-primary);
    }
    .field textarea { resize:vertical; }
    .field-note { flex:1; display:flex; flex-direction:column; }
    .field-note textarea { flex:1; min-height:240px; }

    /* Button group (priority) */
    .btn-group-row { display:flex; gap:5px; flex-wrap:wrap; }
    .choice-btn {
      font-size:12px; padding:4px 11px; border-radius:20px;
      border:0.5px solid var(--border-mid);
      background:transparent; color:var(--text-secondary);
      cursor:pointer; font-family:inherit; font-weight:500;
      transition:all 0.1s;
    }
    .choice-btn:hover { background:var(--bg-secondary); }
    .choice-btn.sel-high { background:#FCEBEB; color:#A32D2D; border-color:#F7C1C1; }
    .choice-btn.sel-mid  { background:#FAEEDA; color:#854F0B; border-color:#FAC775; }
    .choice-btn.sel-low  { background:#EAF3DE; color:#3B6D11; border-color:#C0DD97; }

    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

    /* ── Rich editor ── */
    .editor-tool-btn {
      font-size:12px; padding:3px 8px; border-radius:5px;
      border:0.5px solid transparent; background:transparent;
      color:var(--text-secondary); cursor:pointer; font-family:inherit;
      transition:all 0.1s; line-height:1.4; display:flex; align-items:center; gap:3px;
    }
    .editor-tool-btn:hover { background:var(--bg-primary); border-color:var(--border-mid); color:var(--text-primary); }
    #e-note-editor:empty:before { content:attr(data-placeholder); color:var(--text-tertiary); pointer-events:none; }
    #e-note-editor img { max-width:100%; border-radius:6px; margin:4px 0; display:block; cursor:pointer; }
    #e-note-editor img:hover { outline:2px solid #378ADD; }
    #e-note-editor ol, #e-note-editor ul { padding-left:1.4em; }
    #e-note-editor b, #e-note-editor strong { font-weight:600; }

    /* ── Image lightbox ── */
    #img-lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:9999; align-items:center; justify-content:center; cursor:zoom-out; }
    #img-lightbox.open { display:flex; }
    #img-lightbox img { max-width:90vw; max-height:88vh; border-radius:8px; object-fit:contain; }

    .modal-footer { display:flex; justify-content:space-between; align-items:center; margin-top:1.25rem; }
    .modal-footer-right { display:flex; gap:8px; }

    /* Panel section label */
    .panel-label { font-size:11px; font-weight:500; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:7px; }

    /* ══════════════════════════════════════
       PROJECT VIEW
    ══════════════════════════════════════ */
    .project-list { display:flex; flex-direction:column; gap:8px; margin-bottom:1.5rem; }

    .project-item {
      background:var(--bg-primary);
      border:0.5px solid var(--border-light);
      border-radius:var(--radius-md);
      overflow:hidden;
    }
    .project-item-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 14px;
      cursor:pointer;
      user-select:none;
    }
    .project-item-header:hover { background:var(--bg-secondary); }
    .project-item-left { display:flex; align-items:center; gap:8px; }
    .project-chevron { font-size:11px; color:var(--text-tertiary); transition:transform 0.18s; display:inline-block; }
    .project-item.expanded > .project-item-header .project-chevron { transform:rotate(90deg); }
    .project-item-name { font-size:14px; font-weight:500; color:var(--text-primary); }
    .project-item-count { font-size:12px; color:var(--text-tertiary); }
    .project-item-actions { display:flex; align-items:center; gap:6px; }

    /* Expandable task list inside project */
    .project-task-list { display:none; border-top:0.5px solid var(--border-light); }
    .project-item.expanded .project-task-list { display:block; }
    .project-task-row {
      display:flex; align-items:center; gap:10px;
      padding:8px 14px;
      border-bottom:0.5px solid var(--border-light);
      font-size:13px;
      cursor:pointer;
    }
    .project-task-row:last-child { border-bottom:none; }
    .project-task-row:hover { background:var(--bg-secondary); }
    .project-task-title { flex:1; font-weight:500; color:var(--text-primary); }
    .project-task-meta { display:flex; align-items:center; gap:6px; }

    /* 과업 (프로젝트와 세부업무 사이) */
    .goal-row { display:flex; align-items:center; gap:8px; padding:8px 14px; background:var(--bg-secondary); border-bottom:0.5px solid var(--border-light); font-size:13px; }
    .goal-row-toggle { cursor:pointer; user-select:none; }
    .goal-title { flex:1; min-width:0; font-weight:500; color:var(--text-primary); }
    .goal-title.ungrouped { font-weight:400; color:var(--text-tertiary); }
    .goal-progress { font-size:11px; color:var(--text-tertiary); white-space:nowrap; }
    .goal-progress.all-done { color:#3B6D11; font-weight:500; }
    .goal-tasks .project-task-row { padding-left:28px; }
    .task-path { font-size:11px; color:var(--text-tertiary); margin-bottom:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* 완료 화면 */
    .done-header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .done-summary { font-size:13px; color:var(--text-secondary); }
    .done-header select { font-family:inherit; font-size:12px; padding:4px 8px; border-radius:var(--radius-md); border:0.5px solid var(--border-mid); background:var(--bg-primary); color:var(--text-primary); }
    .done-goal .goal-tasks { display:none; }
    .done-goal.expanded .goal-tasks { display:block; }
    .done-goal.expanded > .goal-row .project-chevron { transform:rotate(90deg); }
    .done-date { font-size:12px; color:var(--text-tertiary); white-space:nowrap; min-width:72px; text-align:right; }
    #done-list .project-task-title { text-decoration:line-through; font-weight:400; color:var(--text-secondary); }
    .stat-link { cursor:pointer; }
    .stat-link:hover { border-color:var(--border-mid); }

    /* ── Weather Widget ── */
    .weather-widget {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--text-secondary);
      cursor: default;
      user-select: none;
    }
    .weather-widget .weather-temp {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 14px;
    }
    .weather-widget .weather-desc {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* ── Auto save ── */
    .save-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: var(--bg-secondary);

      border-radius: var(--radius-md);

      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
    }
    .save-chip:hover { border-color: var(--border-mid); }
    .save-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
    .save-chip[data-state="on"] .save-dot { background: #3B6D11; }

    .save-chip[data-state="paused"] .save-dot { background: #BA7517; }
    .save-chip[data-state="error"] .save-dot { background: #A32D2D; }
    @media (max-width:640px) { #save-chip-label { display:none; } }
    .fs-body { font-size: 14px; line-height: 1.65; color: var(--text-secondary); }
    .fs-body p + p { margin-top: 10px; }
    .fs-body strong { font-weight: 500; color: var(--text-primary); }
    .fs-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 1.25rem; }

<script>
/* ══════════════════════════════════════
   DATA & PERSISTENCE
══════════════════════════════════════ */
const PRI_ORDER       = { high:0, mid:1, low:2 };
const STATUS_CYCLE    = ['todo','inprogress','wait','done'];
const STATUS_LABELS   = { todo:'할 일', inprogress:'진행 중', wait:'대기', done:'완료' };
const STATUS_CLASS    = { todo:'s-todo', inprogress:'s-inprogress', wait:'s-wait', done:'s-done' };

let tasks = [], projects = [], goals = [], editId = null;
let cStatusVal = 'todo', eStatusVal = 'todo';
const NO_PROJECT = '__none__', UNGROUPED = '__ungrouped__';
let boardPath = { project:null, goal:null };
let boardForm = null;   /* 입력 중인 카드 { kind:'project'|'goal'|'task'|'rename', goalId, value, error } */
const doneToggled = new Set();   /* 기본 펼침 상태와 다르게 바꾼 완료 화면 항목 */
const NEW_GOAL = '__new__';

function load() {
  try { tasks    = JSON.parse(localStorage.getItem('ws_tasks')    || '[]'); } catch(e) { tasks = []; }
  try { projects = JSON.parse(localStorage.getItem('ws_projects') || '["웹 리디자인","앱 개발","마케팅","기타"]'); } catch(e) { projects = []; }
  try { goals    = JSON.parse(localStorage.getItem('ws_goals')    || '[]'); } catch(e) { goals = []; }
  /* migrate old 'review' → 'wait' */
  tasks.forEach(t => { if (t.status === 'review') t.status = 'wait'; });
}
function persist() {
  localStorage.setItem('ws_tasks',    JSON.stringify(tasks));
  localStorage.setItem('ws_projects', JSON.stringify(projects));
  localStorage.setItem('ws_goals',    JSON.stringify(goals));
  fsScheduleSave();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function goalOf(t)    { return goals.find(g => g.id === t.goalId) || null; }
function goalTitle(t) { const g = goalOf(t); return g ? g.title : ''; }
function progressOf(list) { return { total:list.length, done:list.filter(t => t.status === 'done').length }; }
function goalProgress(id) { return progressOf(tasks.filter(t => t.goalId === id)); }
function isAllDone(list)  { const p = progressOf(list); return p.total > 0 && p.done === p.total; }
function daysUntil(d) {
  if (!d) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(d + 'T00:00:00');
  return Math.round((due - today) / 86400000);
}

/* ══════════════════════════════════════
   FILTERING & SORTING
══════════════════════════════════════ */
function getFiltered() {
  const q    = document.getElementById('search-input').value.toLowerCase();
  const proj = document.getElementById('filter-project').value;
  const pri  = document.getElementById('filter-priority').value;
  const goal = document.getElementById('filter-goal').value;
  return tasks
    .filter(t =>
      (!q    || t.title.toLowerCase().includes(q) || (t.project||'').toLowerCase().includes(q) || goalTitle(t).toLowerCase().includes(q)) &&
      (!proj || t.project  === proj) &&
      (!goal || t.goalId   === goal) &&
      (!pri  || t.priority === pri)
    )
    .sort((a,b) => (PRI_ORDER[a.priority]??1) - (PRI_ORDER[b.priority]??1));
}

/* 목록 화면에는 진행 중인 업무만 보여준다 */
function getActive() { return getFiltered().filter(t => t.status !== 'done'); }

/* 기간 선택은 완료일이 있는 건에만 적용 — 완료일 기록 전에 끝난 업무가 사라져 보이지 않게 한다 */
function getDone() {
  const days  = Number(document.getElementById('done-period').value);
  const since = days ? Date.now() - days * 86400000 : 0;
  return getFiltered().filter(t => t.status === 'done' && (!t.completedAt || t.completedAt >= since));
}

/* ══════════════════════════════════════
   HTML HELPERS
══════════════════════════════════════ */
function priorityHtml(p) {
  return { high:`<span class="priority p-high">높음</span>`, mid:`<span class="priority p-mid">보통</span>`, low:`<span class="priority p-low">낮음</span>` }[p] || '';
}
function progressHtml(p) {
  const allDone = p.total > 0 && p.done === p.total;
  return `<span class="goal-progress${allDone?' all-done':''}">${p.done}/${p.total} 완료</span>`;
}
function pathHtml(t) {
  const parts = [t.project, goalTitle(t)].filter(Boolean);
  return parts.length ? `<div class="task-path">${escHtml(parts.join(' › '))}</div>` : '';
}
function statusSelectHtml(t) {
  const options = STATUS_CYCLE.map(s => `<option value="${s}"${s===t.status?' selected':''}>${STATUS_LABELS[s]}</option>`).join('');
  return `<select class="status-select ${STATUS_CLASS[t.status]||'s-todo'}" title="상태 변경" onclick="event.stopPropagation()" onchange="setTaskStatus('${t.id}',this.value)">${options}</select>`;
}

/* D-day label for task card */
function cardDueHtml(d, isDone) {
  if (isDone || !d) return '';
  const days = daysUntil(d);
  if (days === null) return '';
  let cls = 'due-label', label = '';
  if (days < 0)       { cls += ' overdue'; label = `D+${Math.abs(days)}`; }
  else if (days === 0){ cls += ' d-day';   label = 'D-Day'; }
  else if (days <= 3) { cls += ' d3';      label = `D-${days}`; }
  else if (days <= 7) { cls += ' d7';      label = `D-${days}`; }
  else                { label = `D-${days}`; }
  return `<span class="${cls}">${label}</span>`;
}

/* Card urgency CSS class */
function cardUrgencyClass(d, isDone) {
  if (isDone || !d) return '';
  const days = daysUntil(d);
  if (days === null) return '';
  if (days === 0 || days < 0) return 'urgent-day';
  if (days <= 3)  return 'urgent-d3';
  if (days <= 7)  return 'urgent-d7';
  return '';
}

/* Due label for list view */
function listDueHtml(d) {
  if (!d) return '-';
  const days = daysUntil(d);
  let cls = 'due-label', label = '';
  if (days < 0)       { cls += ' overdue'; label = `D+${Math.abs(days)}`; }
  else if (days === 0){ cls += ' d-day';   label = 'D-Day'; }
  else if (days <= 3) { cls += ' d3';      label = `D-${days}`; }
  else if (days <= 7) { cls += ' d7';      label = `D-${days}`; }
  else                { label = `D-${days}`; }
  return `<span class="${cls}">${label}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ══════════════════════════════════════
   RENDER
══════════════════════════════════════ */
function renderStats() {
  document.getElementById('st-total').textContent      = tasks.length;
  document.getElementById('st-inprogress').textContent = tasks.filter(t => t.status === 'inprogress').length;
  document.getElementById('st-done').textContent       = tasks.filter(t => t.status === 'done').length;
  const soon = tasks.filter(t => { const d = daysUntil(t.due); return d !== null && d >= 0 && d <= 3 && t.status !== 'done'; });
  document.getElementById('st-due').textContent = soon.length;
}

function sortTasks(arr) {
  const PRIORITY_ORDER = { high: 0, mid: 1, low: 2 };
  return [...arr].sort((a, b) => {
    const aDays = a.due ? daysUntil(a.due) : null;
    const bDays = b.due ? daysUntil(b.due) : null;
    // 마감기한 없는 세부업무는 맨 아래
    if (aDays === null && bDays === null) {
      return (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1);
    }
    if (aDays === null) return 1;
    if (bDays === null) return -1;
    // 마감기한 임박 순 (작을수록 앞)
    if (aDays !== bDays) return aDays - bDays;
    // 같은 날이면 우선순위 높음 먼저
    return (PRIORITY_ORDER[a.priority] ?? 1) - (PRIORITY_ORDER[b.priority] ?? 1);
  });
}

/* ── 보드: 프로젝트 → 과업 → 세부업무 ── */
function projectTasks(project) {
  return tasks.filter(t => project === NO_PROJECT ? !projects.includes(t.project) : t.project === project);
}
function groupTasks(project, goal) {
  const list = projectTasks(project);
  if (goal !== UNGROUPED) return list.filter(t => t.goalId === goal);
  if (project === NO_PROJECT) return list;
  const ids = goals.filter(g => g.project === project).map(g => g.id);
  return list.filter(t => !ids.includes(t.goalId));
}
/* 드래그로 순서를 정한 업무가 앞에 오고, 나머지는 자동 정렬을 따른다 */
function withManualOrder(list, sorted) {
  const placed = list.filter(t => t.order != null).sort((a,b) => a.order - b.order);
  return [...placed, ...sorted(list.filter(t => t.order == null))];
}
function sortBoardTasks(list) {
  const active = list.filter(t => t.status !== 'done');
  const done   = list.filter(t => t.status === 'done');
  const recent = arr => [...arr].sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
  return [...withManualOrder(active, sortTasks), ...withManualOrder(done, recent)];
}
function cardToolsHtml(remove, rename) {
  return `
    <div class="card-tools" onclick="event.stopPropagation()">
      ${rename ? `<button class="card-tool" title="이름 변경" onclick="${rename}">✎</button>` : ''}
      <button class="card-tool card-tool-x" title="삭제" onclick="${remove}">✕</button>
    </div>`;
}
function boardCardHtml(title, sub, list, onclick, tools, selected, drag) {
  const prog = progressOf(list);
  const pct  = prog.total ? Math.round(prog.done / prog.total * 100) : 0;
  /* 카드 안쪽을 열지 않아도 가장 급한 마감이 보이도록 한다 */
  const next = list.filter(t => t.status !== 'done' && t.due).map(t => t.due).sort()[0];
  return `
    <div class="board-card${isAllDone(list)?' is-done':''}${selected?' selected':''}" onclick="${onclick}" ${drag||''}>
      <div class="board-progress"><span style="width:${pct}%"></span></div>
      ${tools}
      <div class="board-card-top">
        <div class="board-card-title">${escHtml(title)}</div>
      </div>
      ${sub ? `<div class="board-card-sub">${sub}</div>` : ''}
      <div class="board-meta"><span>세부업무 ${prog.done}/${prog.total} 완료</span>${next ? listDueHtml(next) : ''}</div>
    </div>`;
}
function boardFormHtml(placeholder) {
  return `
    <div class="board-card board-form" onclick="event.stopPropagation()">
      <input type="text" id="board-form-input" placeholder="${placeholder}" value="${escHtml(boardForm.value)}"
        oninput="boardForm.value=this.value"
        onkeydown="if(event.isComposing)return;if(event.key==='Enter')boardFormSave();if(event.key==='Escape')boardFormCancel()">
      <button class="btn btn-sm btn-primary" onclick="boardFormSave()">저장</button>
      <button class="btn btn-sm" onclick="boardFormCancel()">취소</button>
      ${boardForm.error ? `<div class="board-form-error">${boardForm.error}</div>` : ''}
    </div>`;
}
/* 열의 맨 끝에 놓이는 + 카드 — 누르면 그 자리가 이름 입력 카드로 바뀐다 */
function boardAddCardHtml(kind, placeholder) {
  if (boardForm && boardForm.kind === kind) return boardFormHtml(placeholder);
  return `<button class="board-add-card" data-kind="${kind}" title="${placeholder}" onclick="boardFormOpen('${kind}')">＋</button>`;
}
function taskCardHtml(t, showPath) {
  const isDone  = t.status === 'done';
  const urgency = cardUrgencyClass(t.due, isDone);
  return `
    <div class="task-card${urgency?' '+urgency:''}${isDone?' is-done':''}" onclick="openEditModal('${t.id}')" ${showPath ? '' : dragAttrs('task', t.id)}>
      ${cardToolsHtml(`deleteTask('${t.id}')`)}
      ${showPath ? pathHtml(t) : ''}
      <div class="task-card-top">
        <button class="check-btn" title="${isDone?'완료 취소':'완료 처리'}" onclick="event.stopPropagation();toggleDone('${t.id}')">${isDone?'✓':''}</button>
        <div class="task-title" title="${escHtml(t.title)}">${escHtml(t.title)}</div>
        <div class="task-card-meta">
          <span>${cardDueHtml(t.due, isDone)}</span>
          <span>${priorityHtml(t.priority)}</span>
          ${statusSelectHtml(t)}
        </div>
      </div>
    </div>`;
}

function sortCards(cards) {
  return cards.sort((a,b) => isAllDone(a.list) - isAllDone(b.list)).map(c => c.html);
}
function projectCards() {
  const cards = projects.map((p, i) => {
    const list = projectTasks(p);
    return { list, html:boardCardHtml(p, `과업 ${goals.filter(g => g.project === p).length}개`, list, `boardOpenProject(${i})`, cardToolsHtml(`deleteProject(${i})`), boardPath.project === p, `${dragAttrs('project', p)} data-drop-project="${escHtml(p)}"`) };
  });
  const orphans = projectTasks(NO_PROJECT);
  if (orphans.length) cards.push({ list:orphans, html:boardCardHtml('프로젝트 없음', '', orphans, 'boardOpenProject(-1)', cardToolsHtml('deleteGroup(NO_PROJECT)'), boardPath.project === NO_PROJECT) });
  return sortCards(cards);
}
function goalCards(project) {
  const cards = goals.filter(g => g.project === project).map(g => {
    const list = groupTasks(project, g.id);
    if (boardForm && boardForm.kind === 'rename' && boardForm.goalId === g.id) return { list, html:boardFormHtml('과업 이름') };
    const tools = cardToolsHtml(`deleteGoal('${g.id}')`, `boardFormOpen('rename','${g.id}')`);
    return { list, html:boardCardHtml(g.title, '', list, `boardOpenGoal('${g.id}')`, tools, boardPath.goal === g.id, `${dragAttrs('goal', g.id)} data-drop-goal="${g.id}"`) };
  });
  const ungrouped = groupTasks(project, UNGROUPED);
  if (ungrouped.length) cards.push({ list:ungrouped, html:boardCardHtml('미분류', '', ungrouped, `boardOpenGoal('${UNGROUPED}')`, cardToolsHtml('deleteGroup(boardPath.project)'), boardPath.goal === UNGROUPED, `data-drop-goal="${UNGROUPED}"`) });
  return sortCards(cards);
}
function taskCards(project, goal) {
  return sortBoardTasks(groupTasks(project, goal)).map(t => taskCardHtml(t, false));
}
/* cards가 null이면 왼쪽 열에서 아직 선택하지 않은 상태 */
function boardColumnHtml(label, scope, cards, hint, addCard) {
  const body = cards && cards.length ? cards.join('') : addCard ? '' : `<div class="empty-col">${hint}</div>`;
  return `
    <section class="board-col">
      <div class="board-col-head">${label}${cards ? `<span class="board-col-count">${cards.length}</span>` : ''}</div>
      <div class="board-col-body" data-scope="${escHtml(scope)}">${body}${addCard}</div>
    </section>`;
}
function boardColumnsHtml() {
  const { project, goal } = boardPath;
  return '<div class="board-columns">'
    + boardColumnHtml('프로젝트', 'projects', projectCards(), '', boardAddCardHtml('project', '새 프로젝트 이름'))
    + boardColumnHtml('과업', `goals:${project}`, project ? goalCards(project) : null, '왼쪽에서 프로젝트를 선택하세요',
        project && project !== NO_PROJECT ? boardAddCardHtml('goal', '새 과업 이름') : '')
    + boardColumnHtml('세부업무', `tasks:${project}:${goal}`, goal ? taskCards(project, goal) : null, '왼쪽에서 과업을 선택하세요',
        goal ? boardAddCardHtml('task', '새 세부업무 이름') : '')
    + '</div>';
}
/* 삭제 등으로 사라진 위치에 머물러 있지 않게 한다 */
function normalizeBoardPath() {
  const { project, goal } = boardPath;
  if (project === NO_PROJECT ? !projectTasks(NO_PROJECT).length : project && !projects.includes(project)) { boardPath = { project:null, goal:null }; return; }
  if (goal === UNGROUPED ? !groupTasks(project, UNGROUPED).length : goal && !goals.some(g => g.id === goal && g.project === project)) boardPath.goal = null;
}
function boardOpenProject(i) {
  const project = i < 0 ? NO_PROJECT : projects[i];
  if (project === boardPath.project) return;
  boardPath = { project, goal:i < 0 ? UNGROUPED : null };
  boardForm = null;
  renderBoard();
}
function boardOpenGoal(goal) {
  boardPath.goal = goal;
  boardForm = null;
  renderBoard();
}
function boardFormFocus() {
  const input = document.getElementById('board-form-input');
  input.focus();
  input.select();
}
function boardFormOpen(kind, goalId) {
  boardForm = { kind, goalId, value:goalId ? goals.find(g => g.id === goalId).title : '', error:'' };
  renderBoard();
  boardFormFocus();
}
function boardFormCancel() {
  boardForm = null;
  renderBoard();
}
function boardFormSave() {
  const input = document.getElementById('board-form-input');
  const name  = input.value.trim();
  if (!name) { input.focus(); return; }
  const { kind, goalId } = boardForm;
  const { project, goal } = boardPath;
  const taken = kind === 'project' ? projects.includes(name)
    : kind !== 'task' && goals.some(g => g.project === project && g.title === name && g.id !== goalId);
  if (taken) {
    boardForm.error = '같은 이름이 이미 있습니다';
    renderBoard();
    boardFormFocus();
    return;
  }
  if (kind === 'project') projects.push(name);
  if (kind === 'goal')    createGoal(project, name);
  if (kind === 'rename')  goals.find(g => g.id === goalId).title = name;
  if (kind === 'task')    tasks.unshift({
    id:uid(), title:name,
    project:project === NO_PROJECT ? '' : project,
    goalId:goal === UNGROUPED ? '' : goal,
    priority:'mid', due:'', status:'todo', note:'',
    createdAt:Date.now(), completedAt:null
  });
  boardForm = null;
  persist();
  renderAll();
  const addCard = document.querySelector(`.board-add-card[data-kind="${kind}"]`);
  if (addCard) addCard.scrollIntoView({ block:'nearest' });
}

/* ── 드래그로 순서 변경 — 같은 열 안에서, 완료 여부가 같은 카드끼리만 옮긴다 ──
   세부업무는 다른 과업·프로젝트 카드에, 과업은 다른 프로젝트 카드에 놓아 옮길 수도 있다 */
let dragCard = null, dropTarget = null;
const DROP_TARGETS = { task:'[data-drop-goal],[data-drop-project]', goal:'[data-drop-project]' };
function findDropCard(e) {
  const selector = dragCard && DROP_TARGETS[dragCard.dataset.dragKind];
  const card = selector && e.target.closest(selector);
  return card && !card.classList.contains('selected') ? card : null;   /* 지금 속한 곳에 놓으면 그대로 */
}
function setDropTarget(card) {
  if (dropTarget === card) return;
  if (dropTarget) dropTarget.classList.remove('drop-target');
  dropTarget = card;
  if (card) card.classList.add('drop-target');
}
function moveTaskToGoal(id, goal) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.goalId = goal === UNGROUPED ? '' : goal;
  delete t.order;   /* 옮겨 간 과업에서는 직접 정한 순서 뒤에 붙는다 */
  persist();
  renderAll();
}
/* 다른 프로젝트로 옮긴 세부업무는 그 프로젝트의 미분류에 들어간다 */
function moveTaskToProject(id, project) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.project = project;
  t.goalId  = '';
  delete t.order;
  persist();
  renderAll();
}
/* 과업 안의 세부업무도 함께 옮기고, 옮겨 간 프로젝트의 과업 목록 맨 뒤에 놓는다 */
function moveGoalToProject(id, project) {
  const goal = goals.find(g => g.id === id);
  if (!goal) return;
  goal.project = project;
  tasks.forEach(t => { if (t.goalId === id) t.project = project; });
  goals = [...goals.filter(g => g !== goal), goal];
  persist();
  renderAll();
}
function dragAttrs(kind, id) {
  return `draggable="true" data-drag-kind="${kind}" data-drag-id="${escHtml(id)}"`;
}
function dragColumn(e) {
  const col  = e.target.closest('.board-col');
  const body = col && col.querySelector('.board-col-body');
  return dragCard && body === dragCard.parentNode ? body : null;
}
function moveDragCard(col, y) {
  const done  = dragCard.classList.contains('is-done');
  const peers = [...col.querySelectorAll('[data-drag-id]')].filter(c => c !== dragCard && c.classList.contains('is-done') === done);
  const next  = peers.find(c => { const r = c.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (next) col.insertBefore(dragCard, next);
  else if (peers.length) peers[peers.length - 1].after(dragCard);
}
function saveDragOrder(col) {
  const kind = dragCard.dataset.dragKind;
  const ids  = [...col.querySelectorAll('[data-drag-id]')].map(c => c.dataset.dragId);
  if (kind === 'project') projects = ids;
  if (kind === 'task') ids.forEach((id, i) => { tasks.find(t => t.id === id).order = i; });
  if (kind === 'goal') {
    const own = goals.filter(g => g.project === boardPath.project);
    goals = [
      ...goals.filter(g => g.project !== boardPath.project),
      ...ids.map(id => own.find(g => g.id === id)),
      ...own.filter(g => !ids.includes(g.id))   /* 이름 변경 중이라 화면에 카드가 없는 과업 */
    ];
  }
  persist();
  renderAll();
}
const boardBody = document.getElementById('board-body');
boardBody.addEventListener('dragstart', e => {
  dragCard = e.target.closest ? e.target.closest('[data-drag-id]') : null;
  if (!dragCard) return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragCard.dataset.dragId);
  requestAnimationFrame(() => { if (dragCard) dragCard.classList.add('dragging'); });
});
boardBody.addEventListener('dragover', e => {
  const card = findDropCard(e);
  setDropTarget(card);
  if (card) { e.preventDefault(); return; }
  const col = dragColumn(e);
  if (!col) return;
  e.preventDefault();
  moveDragCard(col, e.clientY);
});
boardBody.addEventListener('drop', e => {
  const card = findDropCard(e);
  if (card) {
    e.preventDefault();
    const { dragId, dragKind } = dragCard.dataset;
    dragCard = dropTarget = null;
    if (dragKind === 'task' && card.dataset.dropGoal)    moveTaskToGoal(dragId, card.dataset.dropGoal);
    if (dragKind === 'task' && card.dataset.dropProject) moveTaskToProject(dragId, card.dataset.dropProject);
    if (dragKind === 'goal') moveGoalToProject(dragId, card.dataset.dropProject);
    return;
  }
  const col = dragColumn(e);
  if (!col) return;
  e.preventDefault();
  saveDragOrder(col);
  dragCard = null;
});
/* 열 밖에 놓거나 Esc로 취소하면 원래 순서로 되돌린다 */
boardBody.addEventListener('dragend', () => {
  if (!dragCard) return;
  dragCard = dropTarget = null;
  renderBoard();
});

const FILTER_IDS = ['search-input','filter-project','filter-goal','filter-priority'];
function clearFilters() {
  FILTER_IDS.forEach(id => { document.getElementById(id).value = ''; });
  renderAll();
}
function renderBoard() {
  const crumbs = document.getElementById('board-crumbs');
  const body   = document.getElementById('board-body');
  /* 검색·필터 중에는 계층을 건너뛰고 해당하는 세부업무를 바로 보여준다 */
  if (FILTER_IDS.some(id => document.getElementById(id).value)) {
    const found = sortBoardTasks(getFiltered());
    crumbs.innerHTML = `<span class="crumb-current">검색 결과 ${found.length}건</span><button class="crumb" onclick="clearFilters()">필터 초기화</button>`;
    body.innerHTML = `<div class="board-grid">${found.length ? found.map(t => taskCardHtml(t, true)).join('') : '<div class="empty-col">조건에 맞는 세부업무가 없습니다</div>'}</div>`;
    return;
  }
  normalizeBoardPath();
  /* 카드를 누르거나 상태를 바꿔도 같은 목록을 보던 위치는 유지한다 */
  const scrolled = new Map([...body.querySelectorAll('.board-col-body')].map(el => [el.dataset.scope, el.scrollTop]));
  crumbs.innerHTML = '';
  body.innerHTML = boardColumnsHtml();
  body.querySelectorAll('.board-col-body').forEach(el => { el.scrollTop = scrolled.get(el.dataset.scope) || 0; });
}

function renderList() {
  const body = document.getElementById('list-body');
  const arr  = getActive();
  if (!arr.length) {
    body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-tertiary);padding:2rem;">세부업무가 없습니다</td></tr>';
    return;
  }
  body.innerHTML = arr.map(t => `
    <tr>
      <td style="font-weight:500;">${escHtml(t.title)}</td>
      <td style="color:var(--text-secondary);">${escHtml(t.project||'-')}</td>
      <td style="color:var(--text-secondary);">${escHtml(goalTitle(t)||'-')}</td>
      <td>${priorityHtml(t.priority)}</td>
      <td>${listDueHtml(t.due)}</td>
      <td>${statusSelectHtml(t)}</td>
      <td><button class="btn btn-sm" onclick="openEditModal('${t.id}')">✏️</button></td>
    </tr>`).join('');
}

function isDoneNodeOpen(key, byDefault) { return doneToggled.has(key) ? !byDefault : byDefault; }
function toggleDoneNode(el) {
  const key = el.dataset.key;
  if (doneToggled.has(key)) doneToggled.delete(key);
  else doneToggled.add(key);
  el.classList.toggle('expanded');
}
function doneDateLabel(t) {
  if (!t.completedAt) return '이전 완료';
  const d = new Date(t.completedAt), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}

/* 완료된 세부업무에서 상위 프로젝트·과업을 거슬러 트리를 만든다 (데이터는 옮기지 않는다) */
function renderDone() {
  const arr = getDone().sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
  document.getElementById('done-summary').textContent = `완료 ${arr.length}건`;
  const list = document.getElementById('done-list');
  if (!arr.length) { list.innerHTML = '<div class="empty-col">이 기간에 완료한 업무가 없습니다</div>'; return; }

  const searching = !!document.getElementById('search-input').value;
  const tree = new Map();   /* 최근 완료 순서가 그대로 프로젝트·과업 순서가 된다 */
  arr.forEach(t => {
    const pkey = t.project || '';
    if (!tree.has(pkey)) tree.set(pkey, new Map());
    const gkey = goalOf(t) ? t.goalId : '';
    if (!tree.get(pkey).has(gkey)) tree.get(pkey).set(gkey, []);
    tree.get(pkey).get(gkey).push(t);
  });

  list.innerHTML = [...tree].map(([project, groups]) => {
    const pkey  = 'p:' + project;
    const count = [...groups.values()].reduce((n, g) => n + g.length, 0);
    const blocks = [...groups].map(([gid, items]) => {
      const key  = gid ? 'g:' + gid : 'n:' + project;
      const goal = goals.find(g => g.id === gid);
      const title = goal
        ? `<div class="goal-title">${escHtml(goal.title)}</div>${progressHtml(goalProgress(gid))}`
        : `<div class="goal-title ungrouped">미분류</div><span class="goal-progress">${items.length}건</span>`;
      const rows = items.map(t => `
        <div class="project-task-row" onclick="openEditModal('${t.id}')">
          <div class="project-task-title">${escHtml(t.title)}</div>
          <div class="project-task-meta">
            ${priorityHtml(t.priority)}
            <span class="done-date">${doneDateLabel(t)}</span>
            ${statusSelectHtml(t)}
          </div>
        </div>`).join('');
      return `
        <div class="done-goal${isDoneNodeOpen(key, searching)?' expanded':''}" data-key="${escHtml(key)}">
          <div class="goal-row goal-row-toggle" onclick="toggleDoneNode(this.parentNode)">
            <i class="project-chevron" style="font-style:normal;">▶</i>${title}
          </div>
          <div class="goal-tasks">${rows}</div>
        </div>`;
    }).join('');
    return `
      <div class="project-item${isDoneNodeOpen(pkey, true)?' expanded':''}" data-key="${escHtml(pkey)}">
        <div class="project-item-header" onclick="toggleDoneNode(this.parentNode)">
          <div class="project-item-left">
            <i class="project-chevron" style="font-style:normal;">▶</i>
            <div>
              <div class="project-item-name">${escHtml(project || '프로젝트 없음')}</div>
              <div class="project-item-count">완료 ${count}건</div>
            </div>
          </div>
        </div>
        <div class="project-task-list">${blocks}</div>
      </div>`;
  }).join('');
}

function updateGoalSelect(prefix, selected) {
  const project = document.getElementById(prefix + '-project').value;
  const sel     = document.getElementById(prefix + '-goal');
  sel.disabled  = !project;
  if (!project) { sel.innerHTML = '<option value="">프로젝트를 먼저 선택하세요</option>'; return; }
  const pgoals = goals.filter(g => g.project === project);
  sel.innerHTML = '<option value="">미분류</option>'
    + pgoals.map(g => `<option value="${g.id}">${escHtml(g.title)}</option>`).join('')
    + `<option value="${NEW_GOAL}">＋ 새 과업 추가…</option>`;

function onGoalSelect(prefix) {
  const sel = document.getElementById(prefix + '-goal');
  if (sel.value !== NEW_GOAL) return;
  sel.value = '';
  const save = () => {
    const name = document.getElementById('ask-name').value.trim();
    if (!name) return;
    fsCloseModal();
    const goal = createGoal(document.getElementById(prefix + '-project').value, name);
    updateGoalSelect(prefix, goal.id);
    renderAll();
  };
  fsShowModal('새 과업', '<div class="field"><input type="text" id="ask-name" placeholder="과업 이름"></div>', [
    { label:'취소', run:fsCloseModal },

  ]);
  const input = document.getElementById('ask-name');
  input.onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) save(); };
  input.focus();
}

  if (found) return found;
  const goal = { id:uid(), project, title, createdAt:Date.now() };
  goals.push(goal);
  persist();
  return goal;
}

  const goal = goals.find(g => g.id === id);
  if (!goal) return;
  const count = tasks.filter(t => t.goalId === id).length;
  askDelete(`"${goal.title}" 과업을 삭제할까요?`, count ? `세부업무 ${count}개는 삭제되지 않고 미분류로 옮겨집니다.` : '이 과업에는 세부업무가 없습니다.', () => {
    goals = goals.filter(g => g.id !== id);
    tasks.forEach(t => { if (t.goalId === id) t.goalId = ''; });
  });
}

/* ══════════════════════════════════════
   EXCEL DOWNLOAD
══════════════════════════════════════ */
function downloadExcel() {
  const arr = getFiltered();
  const header = ['세부업무', '프로젝트', '과업', '우선순위', '마감일', '상태', '완료일', '업무내용'];
  const priLabel = { high:'높음', mid:'보통', low:'낮음' };
  const rows = arr.map(t => [
    t.title,
    t.project || '',
    goalTitle(t),
    priLabel[t.priority] || t.priority,
    t.due || '',
    STATUS_LABELS[t.status] || t.status,
    t.status === 'done' ? doneDateLabel(t) : '',
    (t.note || '').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()
  ]);

  /* Build CSV with BOM for Excel Korean support */
  const BOM = '\uFEFF';
  const escape = v => `"${String(v).replace(/"/g,'""')}"`;
  const lines  = [header, ...rows].map(r => r.map(escape).join(','));
  const csv    = BOM + lines.join('\r\n');

  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = '세부업무_목록.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function insertImages(input) {
  const files = Array.from(input.files);
  if (!files.length) return;
  const editor = document.getElementById('e-note-editor');
  editor.focus();
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      img.style.maxWidth = '100%';
      img.style.borderRadius = '6px';
      img.style.margin = '4px 0';
      img.style.display = 'block';
      img.style.cursor = 'pointer';
      img.onclick = () => openLightbox(img.src);
      /* 커서 위치에 삽입, 없으면 맨 뒤 */
      const sel = window.getSelection();
      if (sel && sel.rangeCount && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(img);
        range.collapse(false);
      } else {
        editor.appendChild(img);
      }
      bindEditorImageClicks();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function bindEditorImageClicks() {
  const editor = document.getElementById('e-note-editor');
  editor.querySelectorAll('img').forEach(img => {
    img.onclick = () => openLightbox(img.src);

}

/* ══════════════════════════════════════
   AUTO SAVE (사용자가 지정한 폴더에 파일로 자동 저장)
   브라우저 저장소가 작업 원본이고, 폴더의 파일은 항상 최신으로 맞춰지는 사본이다.
   Edge·Chrome 전용 기능이며, 그 외 브라우저에서는 기존과 똑같이 동작한다.
══════════════════════════════════════ */
const FS_MAIN_FILE   = 'tasktracker-data.json';
const FS_BACKUP_DIR  = 'backups';
const FS_DAILY_RE    = /^tasktracker-\d{4}-\d{2}-\d{2}\.json$/;
const FS_DAILY_KEEP  = 30;
const FS_DEBOUNCE_MS = 1500;
const FS_SAMPLE_TITLES = ['랜딩 페이지 디자인','사용자 인터뷰 정리','API 연동 테스트','주간 보고서 작성','로고 시안 확인'];
const FS_SUPPORTED   = 'showDirectoryPicker' in window;

let fsDir = null;          /* 지정된 폴더 */
let fsState = 'off';       /* on | waiting | off | paused | error | unsupported */
let fsTimer = null;
let fsSaving = false;
let fsPending = false;
let fsLastSaved = null;
let fsLastDaily = null;

/* ── 폴더 기억하기 (브라우저 재시작 후에도 유지) ── */
function fsIdb(mode, run) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('ws_fs', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('kv');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const db  = open.result;
      const tx  = db.transaction('kv', mode);
      const req = run(tx.objectStore('kv'));
      tx.oncomplete = () => { db.close(); resolve(req.result); };
      tx.onerror    = () => { db.close(); reject(tx.error); };
    };
  });
}
function fsRememberDir(dir) { return fsIdb('readwrite', s => s.put(dir, 'dir')); }
function fsRecallDir()      { return fsIdb('readonly',  s => s.get('dir')); }

/* ── 데이터 ── */
function fsReadJsonKey(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch(e) { return fallback; }
}
function fsCollect() {
  return {
    app: 'TaskTracker',
    version: 2,
    savedAt: new Date().toISOString(),
    tasks: fsReadJsonKey('ws_tasks', []),
    projects: fsReadJsonKey('ws_projects', []),
    goals: fsReadJsonKey('ws_goals', []),
    memo: localStorage.getItem('ws_memo') || '',
  };
}
/* 비어 있거나 샘플뿐인 상태는 보관할 데이터가 아니다 — 파일을 덮어쓰지 않는 기준 */
function fsHasRealTasks(list) {
  if (!list.length) return false;
  return list.length > FS_SAMPLE_TITLES.length || !list.every(t => FS_SAMPLE_TITLES.includes(t.title));
}
function fsIsValid(data) {
  return !!data && data.app === 'TaskTracker' && Array.isArray(data.tasks);
}
function fsSameTasks(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function fsStamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`
       + `_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function fsFormatTime(value) {
  return new Date(value).toLocaleString('ko-KR', { dateStyle:'medium', timeStyle:'short' });
}

/* ── 파일 읽기·쓰기 ── */
async function fsWriteJson(dir, name, data) {
  const handle   = await dir.getFileHandle(name, { create:true });
  const writable = await handle.createWritable();
  await writable.write(JSON.stringify(data, null, 2));
  await writable.close();
}
async function fsParseFile(handle) {
  const file = await handle.getFile();
  try { return JSON.parse(await file.text()); } catch(e) { return undefined; }
}
/* 파일 없음 → null, 읽을 수 없는 파일 → undefined */
async function fsReadMain(dir) {
  let handle;
  try { handle = await dir.getFileHandle(FS_MAIN_FILE); }
  catch(e) { if (e.name === 'NotFoundError') return null; throw e; }
  const data = await fsParseFile(handle);
  return fsIsValid(data) ? data : undefined;
}
async function fsSafetyCopy(dir, prefix, data) {
  const backups = await dir.getDirectoryHandle(FS_BACKUP_DIR, { create:true });
  await fsWriteJson(backups, `${prefix}-${fsStamp()}.json`, data);
}
async function fsDailyCopy(data) {
  const today = fsStamp().slice(0, 10);
  if (fsLastDaily === today) return;
  const backups = await fsDir.getDirectoryHandle(FS_BACKUP_DIR, { create:true });
  const name = `tasktracker-${today}.json`;
  try {
    await backups.getFileHandle(name);
  } catch(e) {
    if (e.name !== 'NotFoundError') throw e;
    await fsWriteJson(backups, name, data);
  }
  fsLastDaily = today;
  const daily = [];
  for await (const entry of backups.keys()) if (FS_DAILY_RE.test(entry)) daily.push(entry);
  daily.sort();
  for (const old of daily.slice(0, Math.max(0, daily.length - FS_DAILY_KEEP))) await backups.removeEntry(old);
}

/* ── 자동 저장 ── */
function fsScheduleSave() {
  if (!fsDir) return;
  clearTimeout(fsTimer);
  fsTimer = setTimeout(fsSaveNow, FS_DEBOUNCE_MS);
}
async function fsSaveNow() {
  clearTimeout(fsTimer);
  fsTimer = null;
  if (!fsDir || fsState === 'paused') return;
  if (fsSaving) { fsPending = true; return; }
  const data = fsCollect();
  if (!fsHasRealTasks(data.tasks)) { fsSetState('waiting'); return; }
  fsSaving = true;
  try {
    await fsWriteJson(fsDir, FS_MAIN_FILE, data);
    fsLastSaved = new Date();
    fsSetState('on');
    await fsDailyCopy(data).catch(e => console.warn('일별 사본 저장 실패', e));
  } catch(e) {
    console.error('자동 저장 실패', e);
    fsSetState(e.name === 'NotAllowedError' ? 'paused' : 'error');
  } finally {
    fsSaving = false;
    if (fsPending) { fsPending = false; fsSaveNow(); }
  }
}
function fsFlush() { if (fsTimer) fsSaveNow(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) fsFlush(); });
window.addEventListener('pagehide', fsFlush);

/* ── 시작 ── */
async function fsInit(hasGesture) {
  if (!FS_SUPPORTED) { fsSetState('unsupported'); return; }
  let dir = null;
  try { dir = await fsRecallDir(); } catch(e) { console.warn('저장 폴더 정보를 읽지 못했습니다', e); }
  if (!dir) {
    fsSetState('off');
    if (!localStorage.getItem('ws_fs_dismissed')) fsShowSetup();
    return;
  }
  fsDir = dir;
  await fsResume(hasGesture);
}
/* 폴더 접근 권한 확인. 권한 요청은 사용자의 클릭 직후에만 가능하다 */
async function fsResume(hasGesture) {
  let perm = await fsDir.queryPermission({ mode:'readwrite' });
  if (perm !== 'granted' && hasGesture) {
    try { perm = await fsDir.requestPermission({ mode:'readwrite' }); }
    catch(e) { console.warn('폴더 권한 요청 실패', e); }
  }
  if (perm === 'granted') { fsSetState('on'); await fsSaveNow(); }
  else fsSetState('paused');
}
async function fsConnect(dir) {
  fsDir = dir;
  fsLastDaily = null;
  try { await fsRememberDir(dir); } catch(e) { console.warn('저장 폴더 정보를 기억하지 못했습니다', e); }
  localStorage.removeItem('ws_fs_dismissed');
  fsCloseModal();
  fsSetState('on');
  await fsSaveNow();
}

/* ── 폴더 지정 ── */
async function fsPickFolder() {
  let dir;
  try {
    dir = await window.showDirectoryPicker({ id:'tasktracker', mode:'readwrite', startIn:'documents' });
  } catch(e) {
    if (e.name !== 'AbortError') console.error('폴더 선택 실패', e);
    return;
  }
  let saved;
  try { saved = await fsReadMain(dir); }
  catch(e) { console.error('폴더 읽기 실패', e); fsShowUnreadable(); return; }

  if (saved === undefined) { fsShowUnreadable(); return; }
  const local = fsCollect();
  if (saved === null || (fsSameTasks(saved.tasks, local.tasks) && fsSameTasks(saved.goals || [], local.goals))) { await fsConnect(dir); return; }
  if (fsHasRealTasks(local.tasks)) fsShowConflict(dir, saved, local);
  else fsShowFound(dir, saved);
}
async function fsRestore(dir, saved) {
  const local = fsCollect();
  try {
    if (fsHasRealTasks(local.tasks)) await fsSafetyCopy(dir, 'before-restore', local);
  } catch(e) {
    console.error('복원 전 사본 저장 실패', e);
    fsShowFailed('복원 전에 현재 데이터를 보관하지 못해서 복원을 멈췄어요. 현재 데이터는 그대로예요.');
    return;
  }
  localStorage.setItem('ws_tasks', JSON.stringify(saved.tasks));
  if (Array.isArray(saved.projects)) localStorage.setItem('ws_projects', JSON.stringify(saved.projects));
  localStorage.setItem('ws_goals', JSON.stringify(Array.isArray(saved.goals) ? saved.goals : []));
  localStorage.setItem('ws_memo', saved.memo || '');
  load();
  renderAll();
  await fsConnect(dir);
}
async function fsKeepLocal(dir, saved) {
  try {
    await fsSafetyCopy(dir, 'before-overwrite', saved);
  } catch(e) {
    console.error('덮어쓰기 전 사본 저장 실패', e);
    fsShowFailed('기존 파일을 보관하지 못해서 연결을 멈췄어요. 파일은 그대로예요.');
    return;
  }
  await fsConnect(dir);
}
async function fsPickBackup() {
  let handle;
  try {
    [handle] = await window.showOpenFilePicker({
      startIn: fsDir,
      types: [{ description:'Task Tracker 백업', accept:{ 'application/json':['.json'] } }],
    });
  } catch(e) {
    if (e.name !== 'AbortError') console.error('파일 선택 실패', e);
    return;
  }
  const saved = await fsParseFile(handle);
  if (!fsIsValid(saved)) { fsShowFailed('Task Tracker 백업 파일이 아니에요. 현재 데이터는 그대로예요.'); return; }
  fsShowModal('백업에서 복원할까요?',
    `<p>${fsDescribe('선택한 백업', saved)}</p>
     <p>${fsDescribe('현재', fsCollect())}</p>
     <p>복원하기 전에 현재 데이터를 <strong>backups</strong> 폴더에 사본으로 남겨요.</p>`,
    [{ label:'취소', run:fsCloseModal },
     { label:'복원', primary:true, run:() => fsRestore(fsDir, saved) }]);
}

/* ── 화면 ── */
function fsSetState(state) {
  fsState = state;
  const labels = {
    on: '자동 저장 중', waiting: '자동 저장 대기', off: '자동 저장 꺼짐',
    paused: '자동 저장 일시정지', error: '자동 저장 실패', unsupported: '자동 저장 미지원',
  };
  const chip = document.getElementById('save-chip');
  chip.dataset.state = state;
  document.getElementById('save-chip-label').textContent = labels[state];
  chip.title = fsLastSaved ? `마지막 저장: ${fsFormatTime(fsLastSaved)}` : '';
}
function fsEscape(text) {
  const el = document.createElement('div');
  el.textContent = text;
  return el.innerHTML;
}
function fsDescribe(label, data) {
  const when = data.savedAt ? ` · ${fsFormatTime(data.savedAt)}` : '';
  return `<strong>${label}</strong>: 세부업무 ${data.tasks.length}개${when}`;
}
function fsShowModal(title, body, actions) {
  document.getElementById('fs-modal-title').textContent = title;
  document.getElementById('fs-modal-body').innerHTML = body;
  const box = document.getElementById('fs-modal-actions');
  box.innerHTML = '';
  actions.forEach(action => {
    const btn = document.createElement('button');
    btn.className = action.primary ? 'btn btn-primary' : 'btn';
    btn.textContent = action.label;
    btn.onclick = action.run;
    box.appendChild(btn);
  });
  document.getElementById('fs-modal-bg').classList.add('open');
}
function fsCloseModal() { document.getElementById('fs-modal-bg').classList.remove('open'); }
function fsDismissSetup() {
  localStorage.setItem('ws_fs_dismissed', '1');
  fsCloseModal();
}
function fsShowSetup() {
  fsShowModal('💾 자동 저장 폴더를 지정해 주세요',
    `<p>지금 데이터는 이 브라우저 안에만 있어서, 브라우저 데이터가 지워지면 함께 사라져요.</p>
     <p>폴더를 <strong>한 번만</strong> 지정하면 내용이 바뀔 때마다 그 폴더의 파일에 자동으로 저장돼요.</p>
     <p><strong>OneDrive 안에 새 폴더</strong>(예: TaskTracker)를 만들어 고르는 걸 추천해요. 문서·다운로드·바탕화면 폴더 자체는 고를 수 없으니, 그 안에 새 폴더를 만들어 주세요.</p>`,
    [{ label:'나중에', run:fsDismissSetup },
     { label:'폴더 지정', primary:true, run:fsPickFolder }]);
}
function fsShowFound(dir, saved) {
  fsShowModal('저장된 데이터를 찾았어요',
    `<p>${fsDescribe('이 폴더의 파일', saved)}</p>
     <p>이 데이터를 불러올까요?</p>`,
    [{ label:'다른 폴더 선택', run:fsPickFolder },
     { label:'불러오기', primary:true, run:() => fsRestore(dir, saved) }]);
}
function fsShowConflict(dir, saved, local) {
  fsShowModal('어떤 데이터를 쓸까요?',
    `<p>이 폴더에 이미 저장된 파일이 있고, 지금 화면의 데이터와 달라요.</p>
     <p>${fsDescribe('폴더의 파일', saved)}<br>${fsDescribe('현재 화면', local)}</p>
     <p>어느 쪽을 골라도 사용하지 않는 데이터는 <strong>backups</strong> 폴더에 사본으로 남겨요.</p>`,
    [{ label:'현재 화면 유지', run:() => fsKeepLocal(dir, saved) },
     { label:'파일 불러오기', primary:true, run:() => fsRestore(dir, saved) }]);
}
function fsShowUnreadable() {
  fsShowModal('이 폴더의 파일을 읽을 수 없어요',
    `<p>폴더에 있는 저장 파일이 손상됐거나 이 앱의 파일이 아니에요. 덮어쓰지 않도록 연결하지 않았어요.</p>
     <p>다른 폴더를 골라 주세요.</p>`,
    [{ label:'닫기', run:fsCloseModal },
     { label:'다른 폴더 선택', primary:true, run:fsPickFolder }]);
}
function fsShowFailed(message) {
  fsShowModal('진행하지 못했어요', `<p>${fsEscape(message)}</p>`, [{ label:'닫기', primary:true, run:fsCloseModal }]);
}
function fsShowStatus() {
  const folder = `<p><strong>저장 폴더</strong>: ${fsEscape(fsDir.name)}</p>`;
  const body = fsState === 'waiting'
    ? `${folder}<p>지금은 세부업무가 없거나 샘플뿐이라, 기존 파일을 지키기 위해 저장하지 않고 있어요. 세부업무를 추가하면 다시 저장돼요.</p>`
    : `${folder}<p><strong>마지막 저장</strong>: ${fsLastSaved ? fsFormatTime(fsLastSaved) : '-'}</p>
       <p>날짜별 사본은 <strong>backups</strong> 폴더에 최근 ${FS_DAILY_KEEP}일치를 보관해요.</p>`;
  fsShowModal('💾 자동 저장', body,
    [{ label:'백업에서 복원', run:fsPickBackup },
     { label:'폴더 변경', run:fsPickFolder },
     { label:'닫기', primary:true, run:fsCloseModal }]);
}
function fsChipClick() {
  if (fsState === 'on' || fsState === 'waiting') { fsShowStatus(); return; }
  if (fsState === 'paused') { fsResume(true); return; }
  if (fsState === 'unsupported') {
    fsShowModal('자동 저장을 쓸 수 없는 브라우저예요',
      '<p>폴더 자동 저장은 Edge와 Chrome에서만 지원돼요. 앱은 지금처럼 그대로 쓸 수 있고, 데이터는 이 브라우저 안에 저장돼요.</p>',
      [{ label:'닫기', primary:true, run:fsCloseModal }]);
    return;
  }
  if (fsState === 'error') {
    fsShowModal('자동 저장에 실패했어요',
      '<p>폴더가 삭제됐거나 옮겨졌을 수 있어요. 데이터는 브라우저에 그대로 있으니, 폴더를 다시 지정해 주세요.</p>',
      [{ label:'닫기', run:fsCloseModal },
       { label:'폴더 지정', primary:true, run:fsPickFolder }]);
    return;
  }
  fsShowSetup();
}

function dayOffset(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

const PASSWORD = 'yujin12345!!';

function tryUnlock() {
  const val = document.getElementById('lock-input').value;
  if (val === PASSWORD) {
    sessionStorage.setItem('ws_auth', '1');
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('main-app').style.display    = 'block';
    load();
    if (!tasks.length) initSample();
    renderAll();
    fsInit(true);
  } else {
    const err = document.getElementById('lock-error');
    err.style.display = 'block';
    document.getElementById('lock-input').value = '';
    document.getElementById('lock-input').focus();
    setTimeout(() => { err.style.display = 'none'; }, 3000);
  }
}

if (sessionStorage.getItem('ws_auth') === '1') {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('main-app').style.display    = 'block';
  load();
  if (!tasks.length) initSample();
  renderAll();
  fsInit(false);
} else {
  setTimeout(() => document.getElementById('lock-input').focus(), 100);
}

/* ══════════════════════════════════════
   WEATHER WIDGET (Open-Meteo — 무료, API 키 불필요)
   위치: 인천 (위도 37.4563, 경도 126.7052)
══════════════════════════════════════ */
const WEATHER_CODES = {
  0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
  45:'🌫️',48:'🌫️',
  51:'🌦️',53:'🌦️',55:'🌧️',
  61:'🌧️',63:'🌧️',65:'🌧️',
  71:'❄️',73:'❄️',75:'❄️',77:'🌨️',
  80:'🌦️',81:'🌧️',82:'⛈️',
  85:'🌨️',86:'🌨️',
  95:'⛈️',96:'⛈️',99:'⛈️'
};
const WEATHER_DESC = {
  0:'맑음',1:'대체로 맑음',2:'구름 조금',3:'흐림',
  45:'안개',48:'안개',
  51:'이슬비',53:'이슬비',55:'이슬비',
  61:'비',63:'비',65:'강한 비',
  71:'눈',73:'눈',75:'강한 눈',77:'눈날림',
  80:'소나기',81:'소나기',82:'강한 소나기',
  85:'눈 소나기',86:'눈 소나기',
  95:'뇌우',96:'우박 동반 뇌우',99:'우박 동반 뇌우'
};

async function fetchWeather() {
  try {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=37.4563&longitude=126.7052'
      + '&current=temperature_2m,weathercode'
      + '&timezone=Asia%2FSeoul';
    const res  = await fetch(url);
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weathercode;
    document.getElementById('weather-icon').textContent = WEATHER_CODES[code] ?? '🌡️';
    document.getElementById('weather-temp').textContent = temp + '°C';
    document.getElementById('weather-desc').textContent = WEATHER_DESC[code] ?? '날씨 정보';
  } catch(e) {
    document.getElementById('weather-icon').textContent = '🌡️';
    document.getElementById('weather-temp').textContent = '--°C';
    document.getElementById('weather-desc').textContent = '연결 실패';
  }
}

// 페이지 로드 시 바로 실행, 이후 30분마다 자동 갱신
fetchWeather();
setInterval(fetchWeather, 30 * 60 * 1000);
